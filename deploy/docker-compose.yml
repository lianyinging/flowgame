# 在 flowgame/deploy 目录执行：docker compose up -d --build
# 要求同级目录存在 flowgame_python 仓库（与 flowgame 并列克隆）
#
# 国内服务器：默认经 DaoCloud 拉 Docker Hub 镜像，避免 1Panel 镜像 docker.1panel.live 超时。
# 海外服务器可在 .env 改回官方镜像名，例如 PYTHON_IMAGE=python:3.10-slim

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    ports:
      - "${FLOWGAME_WEB_PORT:-8009}:8009"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../../flowgame_python
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.10-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      FLOWGAME_HOST: 0.0.0.0
      FLOWGAME_PORT: 8008
      FLOWGAME_UVICORN_WORKERS: ${FLOWGAME_UVICORN_WORKERS:-1}
      FLOWGAME_MAX_CONCURRENT_WORKFLOWS: ${FLOWGAME_MAX_CONCURRENT_WORKFLOWS:-0}
      FLOWGAME_WORKFLOW_QUEUE_TIMEOUT_SEC: ${FLOWGAME_WORKFLOW_QUEUE_TIMEOUT_SEC:-60}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QDRANT_HOST: qdrant
      FLOWGAME_EXECUTION_LOG_ENABLED: ${FLOWGAME_EXECUTION_LOG_ENABLED:-false}
      FLOWGAME_EXECUTION_LOG_PATH: ${FLOWGAME_EXECUTION_LOG_PATH:-/var/log/flowgame/execution.log}
      FLOWGAME_EXECUTION_LOG_CONSOLE: ${FLOWGAME_EXECUTION_LOG_CONSOLE:-true}
      FLOWGAME_EXECUTION_LOG_LEVEL: ${FLOWGAME_EXECUTION_LOG_LEVEL:-INFO}
    volumes:
      - ${FLOWGAME_EXECUTION_LOG_HOST_DIR:-./logs/api}:/var/log/flowgame
    ports:
      - "${FLOWGAME_API_PORT:-8008}:8008"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:-docker.m.daocloud.io/qdrant/qdrant:v1.18.1}
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
