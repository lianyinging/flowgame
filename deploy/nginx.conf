upstream flowgameports {
    server 106.75.153.103:8008;
}

server {
    listen 8009;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API（含流式试运行 NDJSON）
    location /api/ {
        proxy_pass http://flowgameports;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://flowgameports/health;
    }

    location /docs {
        proxy_pass http://flowgameports/docs;
    }

    location /openapi.json {
        proxy_pass http://flowgameports/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
